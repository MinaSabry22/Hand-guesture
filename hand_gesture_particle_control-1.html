<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Hand Gesture Particle Control</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #030305; color: #00ff9d;
         font: 15px/1.5 Consolas, monospace; }
  #scene { position: fixed; inset: 0; }
  #hud { position: fixed; top: 18px; left: 22px; z-index: 3; text-shadow: 0 0 8px #00ff9d; }
  #hud div { margin: 2px 0; }
  #status { color: #ff4c91; margin-top: 10px; max-width: 430px; }
  #camWrap { position: fixed; left: 22px; bottom: 22px; width: 216px; height: 162px;
             border: 2px solid #aaa; border-radius: 10px; overflow: hidden;
             background: #111; box-shadow: 0 0 16px #222; z-index: 3; }
  #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #handCanvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  #hint { position: fixed; bottom: 22px; right: 22px; color: #aaa; z-index: 3; text-align: right; }
  button { background: #10151a; color: #00ff9d; border: 1px solid #00ff9d;
           border-radius: 6px; padding: 9px 14px; cursor: pointer; font: inherit; }
  #start { margin-top: 10px; }
  @media (max-width: 700px) {
    body { font-size: 13px; }
    #hud { top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; }
    #hud div { margin: 1px 0; }
    #status { max-width: 100%; margin-top: 7px; }
    #start { padding: 8px 12px; }
    #camWrap { left: 12px; bottom: max(12px, env(safe-area-inset-bottom));
               width: min(38vw, 170px); height: min(29vw, 128px); }
    #hint { right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
            max-width: 55%; font-size: 11px; }
  }
  @media (max-width: 380px) {
    #hud { font-size: 12px; }
    #camWrap { width: 125px; height: 94px; }
    #hint { max-width: calc(100% - 155px); }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div>1 Finger: Cloud</div>
  <div>2 Fingers: Sphere</div>
  <div>3 Fingers: I LOVE YOU</div>
  <div>4 Fingers: Rotating Heart</div>
  <div>5 Fingers: FOREVER</div>
  <div id="status">Press Start Camera, then show your hand.</div>
  <button id="start">Start Camera</button>
</div>
<div id="camWrap">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="handCanvas"></canvas>
</div>
<div id="hint">Move your hand in front of the camera<br>Allow camera access when prompted<br>Mobile: use HTTPS / Chrome</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
<script>
(() => {
  const COUNT = 6500;
  const sceneEl = document.getElementById('scene');
  const video = document.getElementById('webcam');
  const handCanvas = document.getElementById('handCanvas');
  const handCtx = handCanvas.getContext('2d');
  const statusEl = document.getElementById('status');

  // Three.js particle scene
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.z = 34;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x030305, 1);
  sceneEl.appendChild(renderer.domElement);

  const positions = new Float32Array(COUNT * 3);
  const targets = new Float32Array(COUNT * 3);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    color: 0xff1768, size: 0.105, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  const rand = (min, max) => min + Math.random() * (max - min);
  function setPoint(i, x, y, z) {
    const k = i * 3; targets[k] = x; targets[k+1] = y; targets[k+2] = z;
  }

  function makeSphere() {
    for (let i=0; i<COUNT; i++) {
      const u = Math.random()*2-1, a = Math.random()*Math.PI*2;
      const r = 9 + rand(-0.35, 0.35), s = Math.sqrt(1-u*u);
      setPoint(i, r*s*Math.cos(a), r*u, r*s*Math.sin(a));
    }
  }
  function makeCloud() {
    // Layered, soft cloud-like volume
    const blobs = [[-5,0,0,4.5],[0,2,0,5.2],[4,0,0,4.3],[-2,-2,1,4.1],[2,-2,0,4.4]];
    for (let i=0; i<COUNT; i++) {
      const b = blobs[i % blobs.length];
      const u = Math.random()*2-1, a = Math.random()*Math.PI*2;
      const r = Math.cbrt(Math.random()) * b[3], s = Math.sqrt(1-u*u);
      setPoint(i, b[0]+r*s*Math.cos(a), b[1]+r*u, b[2]+r*s*Math.sin(a));
    }
  }
  function makeHeart() {
    for (let i=0; i<COUNT; i++) {
      const t = Math.random()*Math.PI*2;
      const scale = rand(0.24, 0.30);
      const x = 16*Math.pow(Math.sin(t),3);
      const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      const fill = Math.sqrt(Math.random());
      setPoint(i, x*scale*fill, y*scale*fill, rand(-1.8,1.8)*fill);
    }
  }
  function makeText(text, size=10) {
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 300;
    const cx = c.getContext('2d');
    cx.clearRect(0,0,c.width,c.height);
    cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = 'bold 150px Arial, sans-serif'; cx.fillText(text, 600, 150);
    const data = cx.getImageData(0,0,c.width,c.height).data;
    const points = [];
    for (let y=0; y<c.height; y+=4) for (let x=0; x<c.width; x+=4) {
      if (data[(y*c.width+x)*4+3] > 100) points.push([x,y]);
    }
    for (let i=0; i<COUNT; i++) {
      const p = points[Math.floor(Math.random()*points.length)] || [600,150];
      setPoint(i, (p[0]-600)/size, -(p[1]-150)/size, rand(-1.2,1.2));
    }
  }
  function chooseShape(fingers) {
    if (fingers === 1) { makeCloud(); statusEl.textContent = 'Detected: 1 finger — Cloud'; }
    else if (fingers === 2) { makeSphere(); statusEl.textContent = 'Detected: 2 fingers — Sphere'; }
    else if (fingers === 3) { makeText('I LOVE YOU', 13); statusEl.textContent = 'Detected: 3 fingers — I LOVE YOU'; }
    else if (fingers === 4) { makeHeart(); statusEl.textContent = 'Detected: 4 fingers — Rotating Heart'; }
    else if (fingers === 5) { makeText('FOREVER', 10); statusEl.textContent = 'Detected: 5 fingers — FOREVER'; }
  }
  makeHeart();
  positions.set(targets);
  geometry.attributes.position.needsUpdate = true;

  // MediaPipe hand tracking
  let lastGesture = -1, lastChange = 0;
  function countFingers(lm) {
    // Landmark indices: tips 8,12,16,20; PIP joints 6,10,14,18.
    // Thumb uses x-axis because the webcam preview is mirrored.
    let n = 0;
    if (lm[4].x < lm[3].x) n++;
    [[8,6],[12,10],[16,14],[20,18]].forEach(([tip,pip]) => {
      if (lm[tip].y < lm[pip].y) n++;
    });
    return n;
  }
  function onResults(results) {
    handCanvas.width = handCanvas.clientWidth * devicePixelRatio;
    handCanvas.height = handCanvas.clientHeight * devicePixelRatio;
    handCtx.clearRect(0,0,handCanvas.width,handCanvas.height);
    if (results.image) {
      handCtx.save();
      handCtx.scale(devicePixelRatio, devicePixelRatio);
      // Canvas is mirrored to match the mirrored webcam preview.
      handCtx.translate(handCanvas.clientWidth, 0); handCtx.scale(-1,1);
      handCtx.drawImage(results.image, 0, 0, handCanvas.clientWidth, handCanvas.clientHeight);
      if (results.multiHandLandmarks?.length) {
        for (const lm of results.multiHandLandmarks) {
          drawConnectors(handCtx, lm, HAND_CONNECTIONS, {color:'#00ff9d', lineWidth:2});
          drawLandmarks(handCtx, lm, {color:'#ff315f', lineWidth:1, radius:2});
        }
      }
      handCtx.restore();
    }
    if (!results.multiHandLandmarks?.length) {
      statusEl.textContent = 'No hand detected — show your hand to the camera.';
      lastGesture = -1; return;
    }
    const fingers = countFingers(results.multiHandLandmarks[0]);
    const now = Date.now();
    // Debounce gesture changes to prevent rapid flickering.
    if (fingers >= 1 && fingers <= 5 && (fingers !== lastGesture) && now-lastChange > 700) {
      lastGesture = fingers; lastChange = now; chooseShape(fingers);
    }
  }

  let cameraStream = null;
  let trackingHands = null;
  let tracking = false;
  let lastFrameTime = 0;

  document.getElementById('start').addEventListener('click', async () => {
    const startBtn = document.getElementById('start');
    try {
      startBtn.disabled = true;
      statusEl.textContent = 'Requesting camera permission...';

      // Prefer the front-facing camera on phones; browser may fall back if unavailable.
      cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'user' },
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 24, max: 30 }
        }
      });

      video.srcObject = cameraStream;
      video.setAttribute('playsinline', '');
      video.muted = true;
      await video.play();

      trackingHands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
      });
      trackingHands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0, // lighter model for mobile performance
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.6
      });
      trackingHands.onResults(onResults);
      tracking = true;
      statusEl.textContent = 'Camera is running — show 1 to 5 fingers.';
      processCameraFrames();
    } catch (e) {
      console.error(e);
      statusEl.textContent = 'Camera unavailable. Open via HTTPS, allow camera permission, then try again.';
      startBtn.disabled = false;
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }
  });

  async function processCameraFrames() {
    if (!tracking || !trackingHands || video.readyState < 2) {
      if (tracking) requestAnimationFrame(processCameraFrames);
      return;
    }
    const now = performance.now();
    // Limit inference rate to reduce heat and improve responsiveness on phones.
    if (now - lastFrameTime > 75) {
      lastFrameTime = now;
      try {
        await trackingHands.send({ image: video });
      } catch (err) {
        console.warn('Hand tracking frame skipped:', err);
      }
    }
    if (tracking) requestAnimationFrame(processCameraFrames);
  }

  // Stop camera cleanly if the page is being hidden or closed.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && cameraStream) {
      tracking = false;
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      video.srcObject = null;
      document.getElementById('start').disabled = false;
      statusEl.textContent = 'Camera paused. Press Start Camera to resume.';
    }
  });

  function animate() {
    requestAnimationFrame(animate);
    const p = geometry.attributes.position.array;
    for (let i=0; i<p.length; i++) p[i] += (targets[i]-p[i])*0.075;
    geometry.attributes.position.needsUpdate = true;
    particles.rotation.y += 0.0025;
    particles.rotation.x += 0.0005;
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
